# Helm values for the kagent chart (v1.0.0-alpha3) in a local kind cluster.
#
# This file wires three things together:
#   1. providers      -> kagent generates a `default-model-config` ModelConfig
#                        that points at the in-cluster Ollama Service.
#   2. controller.substrate
#                      -> enables the Agent Substrate integration so that
#                        Harnesses can actually run agents.
#   3. substrateWorkerPool
#                      -> provisions a single gvisor Worker that agent turns
#                        execute on.
#
# The Ollama model name is injected by scripts/up.sh via
#   --set providers.ollama.model="${OLLAMA_MODEL}"
# so it can be overridden per environment without editing this file.

providers:
  default: ollama
  ollama:
    provider: Ollama
    # Default model; overridden by scripts/up.sh from $OLLAMA_MODEL.
    model: "qwen3:8b"
    config:
      # Ollama runs as a Service in the `ollama` namespace inside the cluster.
      # A scheme is required (the runtime url.Parse()s this value).
      host: http://ollama.ollama.svc.cluster.local:11434
      options:
        num_ctx: "32768"

controller:
  grpc:
    # Lets general-purpose clients (grpcurl, ...) discover controller methods.
    reflection: true
  substrate:
    enabled: true
    ateApiEndpoint: dns:///api.ate-system.svc:443
    atenetRouterURL: http://atenet-router.ate-system.svc:80
    defaultWorkerPool:
      name: kagent-default

substrateWorkerPool:
  create: true
  replicas: 1
  # gvisor sandbox runtime — kagent ActorTemplates are compiled to the gvisor
  # class, so this must stay gvisor.
  sandboxClass: gvisor
  workerImage: "ghcr.io/kagent-dev/substrate/ateom-gvisor:v0.2.0-beta5"

# The built-in kagent MCP tool server (kubectl/helm/argo/... tools) stays on.
#
# The built-in Grafana MCP server is ENABLED and pointed at the in-cluster
# Grafana (kube-prometheus-stack, release "kps", service kps-grafana.monitoring,
# service port 80). It authenticates with the ServiceAccount API token that
# scripts/grafana-token.sh creates in the Secret `grafana-mcp-token` (kagent
# namespace) under the key GRAFANA_SERVICE_ACCOUNT_TOKEN, via grafana.secretRef.
#
# NOTE on ordering: the token Secret only exists once Grafana is up, which is
# AFTER the initial kagent install. scripts/up.sh therefore installs kagent
# with `--set grafana-mcp.enabled=false` and re-upgrades it (without that
# override) once the token Secret exists, so the grafana-mcp Pod starts with a
# valid token from the beginning.
grafana-mcp:
  enabled: true
  grafana:
    # In-cluster Grafana API. The grafana-mcp server expects a host:port/api
    # form (no scheme). kps exposes the Grafana service on port 80.
    url: "kps-grafana.monitoring.svc:80/api"
    # Secret (in the kagent namespace) holding GRAFANA_SERVICE_ACCOUNT_TOKEN.
    # Created by scripts/grafana-token.sh.
    secretRef: grafana-mcp-token
